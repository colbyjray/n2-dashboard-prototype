<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>polybot {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script>
    // Inject the dashboard token into every htmx request.
    (function() {
      const t = localStorage.getItem('polybot_token');
      if (!t) {
        if (window.location.pathname !== '/') window.location.href = '/';
        return;
      }
      document.body && document.body.addEventListener('htmx:configRequest', function(evt) {
        evt.detail.headers['X-Polybot-Token'] = t;
      });
    })();
  </script>
</head>
<body>
  <header>
    <h1>polybot</h1>
    <nav>
      <a href="/status">Status</a>
      <a href="/markets">Markets</a>
      <a href="/decisions">Decisions</a>
      <a href="/pnl">P&amp;L</a>
      <a href="/logs">Logs</a>
      <a href="/setup">Setup</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // htmx events bind after body exists.
    document.body.addEventListener('htmx:configRequest', function(evt) {
      const t = localStorage.getItem('polybot_token');
      if (t) evt.detail.headers['X-Polybot-Token'] = t;
    });
  </script>
</body>
</html>
