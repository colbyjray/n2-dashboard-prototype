<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>polybot</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="landing">
    <h1>polybot</h1>
    <p id="msg">Authenticating...</p>
  </main>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const incoming = params.get('token');
      if (incoming) {
        localStorage.setItem('polybot_token', incoming);
        window.history.replaceState({}, '', '/');
      }
      const t = localStorage.getItem('polybot_token');
      if (t) {
        window.location.href = '/status';
      } else {
        document.getElementById('msg').innerText =
          'No token found. Launch the dashboard from your terminal and click the printed URL.';
      }
    })();
  </script>
</body>
</html>
